name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy -- -D warnings
      - name: Install maturin
        run: pip install maturin
      - name: Build and install
        run: maturin develop --release
      - name: Run pytest
        run: |
          pip install pytest
          pytest tests/ -v

  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
      - name: Install maturin
        run: pip install maturin
      - name: Build wheels
        run: maturin build --release
      - name: Smoke test
        shell: bash
        run: |
          pip install target/wheels/hippmem-*.whl
          python -c "from hippmem import Engine; e = Engine.open(); print('OK')"
