name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy -- -D warnings
      - name: Build and test
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release
      - name: Run pytest
        run: |
          pip install pytest
          pytest tests/ -v

  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - name: Smoke test
        shell: bash
        run: |
          pip install dist/hippmem-*.whl || pip install --find-links dist hippmem
          python -c "from hippmem import Engine; e = Engine.open(); e.write('test'); r = e.retrieve('test'); assert len(r.results) > 0; e.close(); print('OK')"
