name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy -- -D warnings
      - name: Install maturin
        run: pip install maturin
      - name: Build wheel
        run: maturin build --release --out dist
      - name: Install wheel
        run: pip install dist/hippmem-*.whl
      - name: Run tests (from /tmp to avoid local package shadowing)
        run: |
          pip install pytest
          cd /tmp
          python -m pytest "$GITHUB_WORKSPACE/tests/" -v
      - name: Smoke test (from /tmp)
        run: |
          cd /tmp
          python -c "from hippmem import Engine; e = Engine.open(); e.write('smoke test'); r = e.retrieve('smoke test'); assert len(r.results) > 0; e.close(); print('OK')"

  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95.0"
      - name: Install maturin
        run: pip install maturin
      - name: Build wheels
        run: maturin build --release
      - name: Smoke test (from /tmp)
        shell: bash
        run: |
          pip install target/wheels/hippmem-*.whl
          cd /tmp
          python -c "from hippmem import Engine; e = Engine.open(); e.write('smoke test'); r = e.retrieve('smoke test'); assert len(r.results) > 0; e.close(); print('OK')"
