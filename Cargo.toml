[package]
name = "hippmem-py"
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
description = "Python bindings for HIPPMEM — native associative memory engine for AI agents"
authors = ["hippmem <hippmem@gmail.com>"]
repository = "https://github.com/hippmem/hippmem-py"
readme = "README.md"

[lib]
name = "hippmem"
crate-type = ["cdylib"]

[dependencies]
hippmem-engine = { path = "../hippmem-dev/crates/hippmem-engine", version = "0.4.1" }
hippmem-core = { path = "../hippmem-dev/crates/hippmem-core", version = "0.4.1" }
pyo3 = { version = "0.23", features = ["extension-module"] }
