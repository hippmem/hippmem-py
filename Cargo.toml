[package]
name = "hippmem-py"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Python bindings for HIPPMEM — native associative memory engine for AI agents"
authors = ["hippmem <hippmem@gmail.com>"]
repository = "https://github.com/hippmem/hippmem-py"
readme = "README.md"

[lib]
name = "hippmem"
crate-type = ["cdylib"]

[dependencies]
hippmem-engine = "0.1.0"
hippmem-core = "0.1.0"
pyo3 = { version = "0.23", features = ["extension-module"] }
