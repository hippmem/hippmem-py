[package]
name = "hippmem-py"
version = "0.4.3"
edition = "2021"
license = "Apache-2.0"
description = "Python bindings for HIPPMEM — native associative memory engine for AI agents"
authors = ["hippmem <hippmem@gmail.com>"]
repository = "https://github.com/hippmem/hippmem-py"
readme = "README.md"

[lib]
name = "hippmem"
crate-type = ["cdylib"]

[dependencies]
# Published source must use crates.io deps — path deps point at a local
# hippmem-dev checkout that does not exist on CI. Local dev overrides them
# with build-local.sh WITHOUT committing (see CLAUDE.md).
hippmem-engine = "0.4.3"
hippmem-core = "0.4.3"
hippmem-model = "0.4.3"
pyo3 = { version = "0.23", features = ["extension-module"] }
